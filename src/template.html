<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>

    <div id="title">
      <h1 class="title">Battleship</h1>
    </div>

    <div id="body">
      <div id="left">
        <h1 class="player1">Player 1</h1>
        <div id="board1">

        </div>
      </div>

      <div id="middle">
        <h2>Place ships</h2>
        <div id="ships">
          <div class="ship-container">
            <h3>Carrier</h3>
            <div class="ship" id="carrier" draggable="true">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>            
            </div>
          </div>
          <div class="ship-container">
            <h3>Battleship</h3>
            <div class="ship" id="battleship" draggable="true">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
          <div class="ship-container">
            <h3>Destroyer</h3>
            <div class="ship" id="destroyer" draggable="true">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
          <div class="ship-container">
            <h3>Submarine</h3>
            <div class="ship" id="submarine" draggable="true">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>            
            </div>
          </div>
          <div class="ship-container">
            <h3>Patrol Boat</h3>
            <div class="ship" id="patrol-boat" draggable="true">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="right">
        <h1 class="player2">Player 2</h1>
        <div id="board2">
        </div>
      </div>
    </div>
  <dialog id="playerNames">
    <form method="dialog" id="name-form">
      <legend class="name-form-title">Choose player names</legend>
      <div id="name-input">
        <label for="player1-name">Player 1 Name:</label>
        <input id="player1-name" name="Player 1 Name" maxlength="20" required>
      </div>
      <div id="name-input">
        <label for="player2-name">Player 2 Name:</label>
        <input id="player2-name" name="Player 2 Name" maxlength="20" required>
      </div>
      <button id="submit-name">Submit</button>
    </form>
  </dialog>
  <dialog id="turn">
      <h1 id="whose-turn"></h1>
      <button id="confirm-turn">ok</button>
  </dialog>

  </body>
</html>
