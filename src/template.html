<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>

    <div id="title">
      <h1 class="title">Battleship</h1>
    </div>

    <div id="body">
      <div id="left">
        <h1>Player 1</h1>
        <div id="board1">

        </div>
      </div>

      <div id="middle">
        <h2>Place ships</h2>
        <div id="ships">
          <div id="carrier">
            <h3>Carrier</h3>
            <div id="image">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>            
            </div>
          </div>
          <div id="battleship">
            <h3>Battleship</h3>
            <div id="image">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
          <div id="destroyer">
            <h3>Destroyer</h3>
            <div id="image">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
          <div id="submarine">
            <h3>Submarine</h3>
            <div id="image">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>            
            </div>
          </div>
          <div id="patrol-boat">
            <h3>Patrol Boat</h3>
            <div id="image">
              <div id="node" class="template"></div>
              <div id="node" class="template"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="right">
        <h1>Player 2</h1>
        <div id="board2">

        </div>
      </div>
    </div>
  </body>
</html>
